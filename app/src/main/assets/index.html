<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Streakline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar, slide-up sheets */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#12151B; --muted:#5D6470; --line:#E0E3E8; --soft:#F6F7F9;
  --accent:#2445D3; --accent-ink:#FFFFFF; --accent-soft:#E6EBFF;
  --miss:#C9372F; --miss-soft:#FBE7E5; --ok:#23884C;
  --c-fitness:#D9572F; --c-mind:#2873CC; --c-habit:#7E4FEA; --c-diet:#23884C; --c-other:#A97614;
  --shadow:0 1px 2px rgba(18,21,27,.06),0 4px 14px rgba(18,21,27,.05);
  --font:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#161A21; --ink:#E8EBF0; --muted:#97A0AD; --line:#262C36; --soft:#1C212A;
  --accent:#8EA3FF; --accent-ink:#0D1015; --accent-soft:#1F2850;
  --miss:#F0756C; --miss-soft:#3A1E1D; --ok:#5CCB88;
  --c-fitness:#FF8A62; --c-mind:#6FB1FF; --c-habit:#B59BFF; --c-diet:#5CCB88; --c-other:#E4B04A;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A21; --ink:#E8EBF0; --muted:#97A0AD; --line:#262C36; --soft:#1C212A;
  --accent:#8EA3FF; --accent-ink:#0D1015; --accent-soft:#1F2850;
  --miss:#F0756C; --miss-soft:#3A1E1D; --ok:#5CCB88;
  --c-fitness:#FF8A62; --c-mind:#6FB1FF; --c-habit:#B59BFF; --c-diet:#5CCB88; --c-other:#E4B04A;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top h1{margin:0;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.datenav{display:flex;align-items:center;gap:2px;margin-top:4px;color:var(--muted);font-size:14px}
.datenav button{width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.datenav button:disabled{opacity:.3;cursor:default}
.datenav .lbl{padding:4px 6px;border-radius:8px;font-weight:600;white-space:nowrap}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--surface);border:1px solid var(--line);flex:none}
svg{display:block}

main{padding-block:4px 120px}
.stack{display:flex;flex-direction:column;gap:14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;gap:12px;align-items:center;padding:14px 14px 10px}
.card-h .t{flex:1;min-width:0}
.card-h h2{margin:0;font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta{margin:2px 0 0;color:var(--muted);font-size:13px}
.daybadge{display:inline-flex;align-items:baseline;gap:3px;font-weight:700;color:var(--ink)}
.daybadge b{font-size:15px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .35s}
.ring.full .fgc{stroke:var(--ok)}

.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);min-height:58px}
.task:last-child{border-bottom:0}
.task.rowbtn{width:100%;text-align:left}
.tick{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--cat);display:grid;place-items:center;color:transparent;transition:background .15s}
.task.done .tick{background:var(--cat);color:var(--surface)}
.tname{flex:1;min-width:0}
.tname span{display:block;font-weight:600;overflow-wrap:anywhere}
.task.done .tname span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tname small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tname small::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--cat)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:18px;font-weight:600;display:grid;place-items:center}
.stepper input{width:64px;height:34px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;padding:0 4px}
.stepper .of{font-size:12px;color:var(--muted);min-width:0;text-align:center;line-height:1.15}
.countwrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}

.rest{padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
details.note{border-top:1px solid var(--line)}
details.note summary{padding:11px 14px;color:var(--muted);font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:"+";font-weight:700}
details.note[open] summary::after{content:"–"}
details.note textarea{display:block;width:calc(100% - 28px);margin:0 14px 14px;min-height:80px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft)}
.banner{margin:0 14px 12px;padding:10px 12px;border-radius:10px;background:var(--miss-soft);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{color:var(--miss)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--soft);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--miss)}
.btn.small{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1}

/* empty + templates */
.hero{padding:22px 4px 6px}
.hero h2{margin:0 0 6px;font-size:22px;line-height:1.2;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tpl b{font-size:15px}
.tpl .d{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--cat)}
.note-muted{color:var(--muted);font-size:13px;margin:10px 2px 0}

/* list */
.litem{display:flex;gap:12px;align-items:center;padding:14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.litem:last-child{border-bottom:0}
.litem .t{flex:1;min-width:0}
.litem b{display:block;overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--muted);flex:none}
.pill.active{background:var(--accent-soft);color:var(--accent)}
.pill.done{color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* progress */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.stat{background:var(--surface);padding:12px 14px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cal{padding:12px 14px 14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cell{aspect-ratio:1;max-width:100%;border-radius:7px;position:relative;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);overflow:hidden}
.cell i{position:absolute;inset:0;background:var(--accent)}
.cell span{position:relative}
.cell.full{border-color:var(--accent)} .cell.full span{color:var(--accent-ink)}
.cell.part span{color:var(--ink)}
.cell.miss{background:var(--miss-soft);border-color:transparent} .cell.miss span{color:var(--miss)}
.cell.rest{border-style:dashed}
.cell.future{opacity:.45}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.tstat{padding:12px 14px;border-bottom:1px solid var(--line)}
.tstat:last-child{border-bottom:0}
.tstat .top-l{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tstat .top-l span{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tstat .top-l em{font-style:normal;color:var(--muted);font-size:13px;flex:none}
.tstat .bar i{background:var(--cat)}
.sec-h{padding:12px 14px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:12px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .24s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:18px}
.sheet-b{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
@media (min-width:640px){.sheet{left:50%;width:600px;margin-left:-300px}}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.inp{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:0 12px;width:100%;min-width:0}
textarea.inp{height:auto;padding:10px 12px;min-height:110px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.switch small{display:block;color:var(--muted);font-size:13px}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.tedit{border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.tedit .r1{display:flex;gap:8px}
.tedit .r1 .inp{flex:1}
.tedit .del{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--miss);flex:none}
.wds{display:flex;gap:4px}
.wds button{flex:1;height:32px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.wds button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.inp{appearance:auto}
.code{width:100%;min-height:140px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top"><div class="wrap" id="hdr"></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabbar"><div class="wrap" id="tabs"></div></nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const toStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const today=()=>toStr(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return toStr(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const wday=s=>parse(s).getDay();
const WD=['S','M','T','W','T','F','S'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt=s=>{const d=parse(s);return DAYN[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
const fmtShort=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const num=n=>Number(n).toLocaleString('en-IN');
const ALLWD=[0,1,2,3,4,5,6];
const CATS={fitness:'Fitness',mind:'Mind',habit:'Habit',diet:'Diet',other:'Other'};
const catOf=c=>CATS[c]?c:'other';
const isAndroid=!!(window.Android&&typeof window.Android.saveState!=='undefined');

const I={
 check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 tToday:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
 tList:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
 tChart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'
};

/* ---------- storage (Android bridge file, else localStorage) ---------- */
const KEY='streakline.v1';
const Store={
 load(){try{const raw=isAndroid?window.Android.loadState():localStorage.getItem(KEY);return raw?JSON.parse(raw):null}catch(e){return null}},
 save(s){const raw=JSON.stringify(s);try{if(isAndroid)window.Android.saveState(raw);else localStorage.setItem(KEY,raw)}catch(e){}}
};
const fresh=()=>({v:1,challenges:[],logs:{},settings:{reminder:null}});
let S=Store.load()||fresh();
if(!S.logs)S.logs={}; if(!S.settings)S.settings={reminder:null}; if(!Array.isArray(S.challenges))S.challenges=[];
const save=()=>Store.save(S);

/* ---------- domain ---------- */
const endOf=c=>addDays(c.start,c.days-1);
const statusOf=c=>{const t=today();return t<c.start?'upcoming':t>endOf(c)?'finished':'active'};
const activeOn=(c,d)=>d>=c.start&&d<=endOf(c);
const dayNo=(c,d)=>diff(c.start,d)+1;
const sched=(c,d)=>{const w=wday(d);return c.tasks.filter(t=>(t.wd||ALLWD).includes(w))};
const getLog=(cid,d,make)=>{let L=S.logs[cid];if(!L){if(!make)return null;L=S.logs[cid]={}}let e=L[d];if(!e&&make)e=L[d]={t:{},note:''};return e};
const valOf=(cid,d,tid)=>{const e=getLog(cid,d);return e&&e.t?e.t[tid]:undefined};
const isDone=(t,v)=>t.type==='count'?(+v||0)>=(+t.target||1):v===true;
function ratio(c,d){const ts=sched(c,d);if(!ts.length)return null;let n=0;ts.forEach(t=>{if(isDone(t,valOf(c.id,d,t.id)))n++});return n/ts.length}
function stats(c){
 const t=today(),end=endOf(c),last=t<end?t:end;
 let perfect=0,missed=0,sum=0,n=0,run=0,best=0,firstMiss=null;
 for(let i=0;i<c.days;i++){
  const d=addDays(c.start,i);if(d>last)break;
  const r=ratio(c,d);if(r===null)continue;
  const past=d<t;
  if(r===1){perfect++;run++;if(run>best)best=run}
  else if(past){missed++;run=0;if(!firstMiss)firstMiss=d}
  if(past||r===1){sum+=r;n++}
 }
 const dn=Math.max(0,Math.min(c.days,dayNo(c,t)));
 return {perfect,missed,streak:run,best,completion:n?sum/n:0,dayNow:dn,firstMiss};
}
function taskStats(c){
 const t=today(),end=endOf(c),last=t<end?t:end;
 return c.tasks.map(task=>{
  let due=0,done=0,total=0;
  for(let i=0;i<c.days;i++){
   const d=addDays(c.start,i);if(d>last)break;
   if(!(task.wd||ALLWD).includes(wday(d)))continue;
   const v=valOf(c.id,d,task.id),ok=isDone(task,v);
   if(d<t||ok){due++;if(ok)done++}
   if(task.type==='count')total+=(+v||0);
  }
  return {task,due,done,total};
 });
}

function ring(r){

 return `<div class="ring ${p===1?'full':''}"><svg width="46" height="46" viewBox="0 0 46 46"><circle class="bgc" cx="23" cy="23" r="19" fill="none" stroke-width="5"/><circle class="fgc" cx="23" cy="23" r="19" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 23 23)"/></svg><span>${r==null?'Rest':Math.round(p*100)+'%'}</span></div>`;
}
function tplGrid(){

}
function viewToday(){

 if(!S.challenges.length){
  return `<div class="hero"><h2>Pick a challenge and start today.</h2><p>Set a length like 10, 30 or 60 days, list the daily tasks, then tick them off here each day. Everything stays on this phone.</p></div>

function card(c,d){
 const ts=sched(c,d),r=ratio(c,d),n=dayNo(c,d),left=c.days-n;
 const e=getLog(c.id,d),note=e?e.note||'':'';
 let banner='';
 if(c.strict&&d===today()){const st=stats(c);if(st.firstMiss)banner=`<div class="banner"><span><b>Day ${dayNo(c,st.firstMiss)} was missed.</b> Strict rules say restart.</span><button class="btn small" data-act="askRestart" data-cid="${c.id}">Restart</button></div>`}
 const rows=ts.map(t=>{
  const v=valOf(c.id,d,t.id),done=isDone(t,v),cat=catOf(t.cat);
  if(t.type==='count'){
   const tg=+t.target||1;
   return `<li class="task ${done?'done':''}" style="--cat:var(--c-${cat})"><button class="tick" data-act="fill" data-cid="${c.id}" data-tid="${t.id}" aria-label="Mark ${esc(t.name)} done">${I.check}</button><div class="tname"><span>${esc(t.name)}</span><small>${CATS[cat]}</small></div><div class="countwrap"><div class="stepper"><button data-act="dec" data-cid="${c.id}" data-tid="${t.id}" aria-label="Decrease">−</button><input type="number" inputmode="decimal" min="0" id="v-${c.id}-${t.id}" data-ch="setv" data-cid="${c.id}" data-tid="${t.id}" value="${+v||0}" aria-label="${esc(t.name)} amount"><button data-act="inc" data-cid="${c.id}" data-tid="${t.id}" aria-label="Increase">+</button></div><span class="stepper of">of ${num(tg)} ${esc(t.unit)}</span></div></li>`;
  }
  return `<li><button class="task rowbtn ${done?'done':''}" style="--cat:var(--c-${cat})" data-act="toggle" data-cid="${c.id}" data-tid="${t.id}" aria-pressed="${done}"><span class="tick">${I.check}</span><span class="tname"><span>${esc(t.name)}</span><small>${CATS[cat]}</small></span></button></li>`;
 }).join('');
 return `<section class="card"><div class="card-h"><div class="t"><h2>${esc(c.name)}</h2><p class="meta"><span class="daybadge"><b>Day ${n}</b> of ${c.days}</span> · ${left===0?'last day':left+' to go'}${c.strict?' · strict':''}</p></div>${ring(r)}</div>${banner}
 ${ts.length?`<ul class="tasks">${rows}</ul>`:`<div class="rest">Rest day. No tasks are scheduled for ${DAYN[wday(d)]}.</div>`}
 <details class="note" data-cid="${c.id}" ${ui.openNotes[c.id]||note?'open':''}><summary>Note for the day</summary><textarea id="n-${c.id}" data-in="note" data-cid="${c.id}" placeholder="Weight, how you felt, what got in the way…">${esc(note)}</textarea></details></section>`;
}
function viewList(){
 const groups={active:[],upcoming:[],finished:[]};
 S.challenges.forEach(c=>groups[statusOf(c)].push(c));
 const item=c=>{const st=stats(c),s=statusOf(c);const pct=s==='upcoming'?0:Math.round(st.dayNow/c.days*100);
  return `<button class="litem" data-act="openProgress" data-cid="${c.id}"><div class="t"><b>${esc(c.name)}</b><span class="meta">${fmtShort(c.start)} – ${fmtShort(endOf(c))} · ${c.days} days · ${c.tasks.length} task${c.tasks.length===1?'':'s'}</span>${s==='upcoming'?'':`<div class="bar"><i style="width:${pct}%"></i></div>`}</div><span class="pill ${s==='active'?'active':s==='finished'?'done':''}">${s==='active'?'Day '+st.dayNow:s==='upcoming'?'Starts '+fmtShort(c.start):Math.round(st.completion*100)+'% done'}</span></button>`};
 const sec=(k,l)=>groups[k].length?`<div class="label">${l}</div><div class="card">${groups[k].map(item).join('')}</div>`:'';
 return `<div class="row" style="margin-top:6px"><button class="btn primary" data-act="newChallenge">${I.plus} New challenge</button></div>
 ${sec('active','Running')}${sec('upcoming','Upcoming')}${sec('finished','Finished')}
 ${S.challenges.length?'':'<p class="note-muted">No challenges yet.</p>'}
 <div class="label">Templates</div>${tplGrid()}`;
}
function viewProgress(){
 if(!S.challenges.length)return `<div class="hero"><h2>No progress to show yet.</h2><p>Start a challenge and your day-by-day grid, streaks and task totals appear here.</p></div><div class="row" style="margin-top:14px"><button class="btn primary" data-act="newChallenge">${I.plus} New challenge</button></div>`;
 const order={active:0,upcoming:1,finished:2};
 const cs=S.challenges.slice().sort((a,b)=>order[statusOf(a)]-order[statusOf(b)]);
 let c=cs.find(x=>x.id===ui.pid)||cs[0];ui.pid=c.id;
 const st=stats(c),t=today(),s=statusOf(c);
 const off=wday(c.start);
 let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
 for(let i=0;i<c.days;i++){
  const d=addDays(c.start,i),r=ratio(c,d);let cls='cell',inner='';
  if(d>t)cls+=' future';
  else if(r===null)cls+=' rest';
  else if(r===1){cls+=' full';inner='<i></i>'}
  else if(r>0){cls+=' part';inner=`<i style="opacity:${(.18+.5*r).toFixed(2)}"></i>`}
  else if(d<t)cls+=' miss';
  if(d===t)cls+=' today';
  cells+=d>t?`<div class="${cls}" title="${fmt(d)}"><span>${i+1}</span></div>`:`<button class="${cls}" data-act="jump" data-d="${d}" aria-label="Day ${i+1}, ${fmt(d)}">${inner}<span>${i+1}</span></button>`;
 }
 const tstats=taskStats(c).map(x=>{const p=x.due?Math.round(x.done/x.due*100):0;const cat=catOf(x.task.cat);
  return `<div class="tstat" style="--cat:var(--c-${cat})"><div class="top-l"><span>${esc(x.task.name)}</span><em>${x.done}/${x.due} days${x.task.type==='count'&&x.total?' · '+num(x.total)+' '+esc(x.task.unit):''}</em></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
 const dayLbl=s==='upcoming'?`<div class="v">${diff(t,c.start)}<small> days</small></div><div class="k">Until start</div>`:`<div class="v">${s==='finished'?c.days:st.dayNow}<small>/${c.days}</small></div><div class="k">${s==='finished'?'Finished':'Day'}</div>`;
 return `<div class="chips" role="tablist">${cs.map(x=>`<button class="chip ${x.id===c.id?'on':''}" data-act="pick" data-cid="${x.id}">${esc(x.name)}</button>`).join('')}</div>
 <div class="stack" style="margin-top:12px">
 <section class="card"><div class="stats">
  <div class="stat">${dayLbl}</div>
  <div class="stat"><div class="v">${Math.round(st.completion*100)}<small>%</small></div><div class="k">Tasks completed</div></div>
  <div class="stat"><div class="v">${st.streak}<small> best ${st.best}</small></div><div class="k">Current streak</div></div>
  <div class="stat"><div class="v">${st.perfect}<small> · ${st.missed} missed</small></div><div class="k">Perfect days</div></div>
 </div></section>
 <section class="card"><div class="sec-h">Day by day</div><div class="cal"><div class="cal-grid">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
 <div class="legend"><span><i style="background:var(--accent);border-color:var(--accent)"></i>All done</span><span><i style="background:var(--accent-soft)"></i>Partly</span><span><i style="background:var(--miss-soft);border-color:transparent"></i>Missed</span><span><i style="border-style:dashed"></i>Rest</span></div>
 <p class="note-muted" style="margin:10px 0 0">Tap a day to view or fix its log.</p></div></section>
 <section class="card"><div class="sec-h">By task</div>${tstats}</section>
 <div class="row"><button class="btn" data-act="edit" data-cid="${c.id}">Edit</button><button class="btn" data-act="askRestart" data-cid="${c.id}">Restart</button><button class="btn danger" data-act="askDelete" data-cid="${c.id}">Delete</button></div>
 </div>`;
}

function saveDraft(){
 const D=ui.draft;
 D.name=(D.name||'').trim();D.days=Math.max(1,Math.min(1000,parseInt(D.days,10)||0));
 D.tasks=D.tasks.filter(t=>(t.name||'').trim()).map(t=>Object.assign(t,{name:t.name.trim(),target:t.type==='count'?Math.max(0.1,+t.target||1):1,wd:(t.wd&&t.wd.length?t.wd:ALLWD.slice())}));
 if(!D.name){toast('Give the challenge a name');$('#f-name')&&$('#f-name').focus();return}
 if(!D.tasks.length){toast('Add at least one task');return}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(D.start||''))D.start=today();
 if(D.id){const i=S.challenges.findIndex(x=>x.id===D.id);S.challenges[i]=D;toast('Changes saved')}
 else{D.id=uid();D.created=today();S.challenges.push(D);toast(D.start>today()?'Scheduled for '+fmtShort(D.start):'Day 1 starts now');ui.tab='today';ui.date=today()}

}

function setVal(cid,tid,val){
 const c=S.challenges.find(x=>x.id===cid);if(!c)return;
 const d=ui.date,before=ratio(c,d),e=getLog(cid,d,true);
 if(val===false||val===0||val==null)delete e.t[tid];else e.t[tid]=val;
 save();
 const after=ratio(c,d);
 if(before!==1&&after===1)toast(`Day ${dayNo(c,d)} complete · ${c.name}`);
 renderView();
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
const findC=id=>S.challenges.find(x=>x.id===id);
const findT=(c,tid)=>c&&c.tasks.find(t=>t.id===tid);
function stepOf(t){const g=+t.target||1;return g>=2000?500:g>=200?10:g>=40?5:1}

const A={
 tab:el=>{ui.tab=el.dataset.tab;if(ui.tab!=='today')ui.date=today();render();window.scrollTo(0,0)},
 prevDay:()=>{ui.date=addDays(ui.date,-1);render()},
 nextDay:()=>{if(ui.date<today()){ui.date=addDays(ui.date,1);render()}},
 goToday:()=>{ui.date=today();render()},
 settings:openSettings,
 close:closeSheet,
 toggle:el=>{const c=findC(el.dataset.cid),v=valOf(c.id,ui.date,el.dataset.tid);setVal(c.id,el.dataset.tid,v===true?false:true)},
 fill:el=>{const c=findC(el.dataset.cid),t=findT(c,el.dataset.tid),v=valOf(c.id,ui.date,t.id);setVal(c.id,t.id,isDone(t,v)?0:+t.target||1)},
 inc:el=>{const c=findC(el.dataset.cid),t=findT(c,el.dataset.tid),v=+valOf(c.id,ui.date,t.id)||0;setVal(c.id,t.id,+(v+stepOf(t)).toFixed(2))},
 dec:el=>{const c=findC(el.dataset.cid),t=findT(c,el.dataset.tid),v=+valOf(c.id,ui.date,t.id)||0;setVal(c.id,t.id,Math.max(0,+(v-stepOf(t)).toFixed(2)))},
 newChallenge:()=>openEditor(null),
 newFromTpl:el=>openEditor(null,TEMPLATES[+el.dataset.i]),
 applyTpl:el=>{const tp=fromTpl(TEMPLATES[+el.dataset.i]);Object.assign(ui.draft,tp);renderEditor()},
 dur:el=>{ui.draft.days=+el.dataset.n;renderEditor()},
 addTask:()=>{ui.draft.tasks.push({id:uid(),name:'',cat:'habit',type:'check',target:1,unit:'',wd:ALLWD.slice()});renderEditor();const b=$('#edb');b.scrollTop=b.scrollHeight;const ins=b.querySelectorAll('[data-in="tname"]');ins[ins.length-1].focus()},
 delTask:el=>{ui.draft.tasks.splice(+el.dataset.i,1);renderEditor()},
 ttype:el=>{const t=ui.draft.tasks[+el.dataset.i];t.type=el.dataset.v;if(t.type==='count'&&(!t.target||t.target<=1))t.target=10;renderEditor()},
 twd:el=>{const t=ui.draft.tasks[+el.dataset.i],k=+el.dataset.k;t.wd=t.wd||ALLWD.slice();const j=t.wd.indexOf(k);if(j>=0){if(t.wd.length>1)t.wd.splice(j,1);else toast('Keep at least one day')}else{t.wd.push(k);t.wd.sort()}renderEditor()},
 saveDraft,
 openProgress:el=>{ui.pid=el.dataset.cid;ui.tab='progress';render();window.scrollTo(0,0)},
 pick:el=>{ui.pid=el.dataset.cid;renderView()},
 jump:el=>{ui.date=el.dataset.d;ui.tab='today';render();window.scrollTo(0,0)},
 edit:el=>openEditor(findC(el.dataset.cid)),
 askRestart:el=>{const c=findC(el.dataset.cid);confirmSheet('Restart '+esc(c.name)+'?','Day 1 becomes today and this challenge\'s past logs are cleared. Tasks stay the same.','Restart from today','doRestart',c.id)},
 doRestart:el=>{const c=findC(el.dataset.cid);c.start=today();c.attempt=(c.attempt||1)+1;delete S.logs[c.id];save();closeSheet();ui.date=today();render();toast('Restarted. Day 1 is today')},
 askDelete:el=>{const c=findC(el.dataset.cid);confirmSheet('Delete '+esc(c.name)+'?','The challenge and every day logged in it are removed from this phone. This cannot be undone.','Delete','doDelete',c.id,true)},
 doDelete:el=>{S.challenges=S.challenges.filter(x=>x.id!==el.dataset.cid);delete S.logs[el.dataset.cid];ui.pid=null;save();closeSheet();render();toast('Challenge deleted')},
 askWipe:()=>confirmSheet('Erase all data?','Every challenge and log on this phone is removed. Export a backup first if you might want it back.','Erase everything','doWipe','',true),
 doWipe:()=>{const r=S.settings.reminder;S=fresh();S.settings.reminder=r;save();closeSheet();ui.pid=null;ui.date=today();render();toast('All data erased')},
 export:()=>{
  const json=JSON.stringify(S);
  if(isAndroid&&window.Android.exportBackup){window.Android.exportBackup(json,'streakline-backup-'+today()+'.json');return}
  $('#bk').innerHTML=`<textarea class="code" id="bk-out" readonly>${esc(json)}</textarea><button class="btn small" data-act="copyBk">Copy</button>`;
 },
 copyBk:()=>{const ta=$('#bk-out');const done=()=>toast('Backup copied');try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast('Selected. Copy it manually')})}catch(e){ta.select();toast('Selected. Copy it manually')}},
 import:()=>{
  if(isAndroid&&window.Android.pickBackup){window.Android.pickBackup();return}
  $('#bk').innerHTML=`<input type="file" accept=".json,application/json,text/plain" id="bk-file" class="inp" style="padding-top:9px"><textarea class="code" id="bk-in" placeholder="…or paste backup text here"></textarea><button class="btn small" data-act="importPaste">Restore pasted text</button>`;
 },
 importPaste:()=>{const v=$('#bk-in').value.trim();if(v)importText(v);else toast('Paste the backup text first')},
 remOn:()=>{const v=$('#f-rem').value||'21:00';const p=v.split(':');window.Android.setReminder(+p[0],+p[1]);S.settings.reminder=v;save();toast('Reminder set for '+v);openSettings()},
 remOff:()=>{window.Android.cancelReminder();S.settings.reminder=null;save();toast('Reminder off');openSettings()},
 sample:()=>{
  const a=fromTpl(TEMPLATES[0]);a.id=uid();a.name='Fit in 30 (sample)';a.start=addDays(today(),-9);
  const b=fromTpl(TEMPLATES[1]);b.id=uid();b.name='Learn daily (sample)';b.start=addDays(today(),-4);b.days=30;
  S.challenges.push(a,b);
  const fillC=(c,n,miss)=>{for(let i=0;i<n;i++){const d=addDays(c.start,i),e=getLog(c.id,d,true);sched(c,d).forEach((t,k)=>{if(miss.includes(i)&&k%2===0)return;e.t[t.id]=t.type==='count'?(i%4===2&&k===1?Math.round(t.target*.6):t.target):true})}};
  fillC(a,9,[3]);fillC(b,4,[]);save();render();toast('Sample data loaded. Delete it any time');
 }
};

document.addEventListener('click',e=>{
 if(e.target.id==='scrim'){closeSheet();return}
 const el=e.target.closest('[data-act]');if(!el)return;
 const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
let noteT;
document.addEventListener('input',e=>{
 const el=e.target,k=el.dataset.in;if(!k)return;const D=ui.draft;
 if(k==='note'){const en=getLog(el.dataset.cid,ui.date,true);en.note=el.value;clearTimeout(noteT);noteT=setTimeout(save,400);return}
 if(!D)return;
 if(k==='dname')D.name=el.value;
 else if(k==='ddays'){D.days=parseInt(el.value,10)||0;const en=$('#f-endnote');if(en&&D.days>0)en.textContent='Ends '+fmt(addDays(D.start,D.days-1));document.querySelectorAll('[data-act="dur"]').forEach(b=>b.classList.toggle('on',+b.dataset.n===D.days))}
 else if(k==='dstart'){if(el.value){D.start=el.value;const en=$('#f-endnote');if(en)en.textContent='Ends '+fmt(addDays(D.start,Math.max(1,D.days)-1))}}
 else if(k==='dstrict')D.strict=el.checked;
 else if(k==='tname')D.tasks[+el.dataset.i].name=el.value;
 else if(k==='ttarget')D.tasks[+el.dataset.i].target=el.value;
 else if(k==='tunit')D.tasks[+el.dataset.i].unit=el.value;
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='f-strict'&&ui.draft){ui.draft.strict=el.checked;return}
 if(el.id==='bk-file'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(el.files[0]);return}
 const k=el.dataset.ch;if(!k)return;
 if(k==='setv'){const v=Math.max(0,parseFloat(el.value)||0);setVal(el.dataset.cid,el.dataset.tid,v)}
 if(k==='tcat'&&ui.draft){ui.draft.tasks[+el.dataset.i].cat=el.value;renderEditor()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.note'))ui.openNotes[d.dataset.cid]=d.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* Android back button: close sheet, then go to Today, then exit */
window.onAndroidBack=function(){
 if(ui.sheet){closeSheet();return true}
 if(ui.tab!=='today'||ui.date!==today()){ui.tab='today';ui.date=today();render();return true}
 return false;
};
/* refresh when the app comes back on a new day */
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDay){if(ui.date===lastDay)ui.date=today();lastDay=today();render()}});

render();
})();
</script>
</body></html>

:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#EDF0F4; --ink:#101826; --ink-2:#3E4859; --muted:#667085; --line:#E1E5EB;
  --primary:#101826; --on-primary:#FFFFFF;
  --accent:#6250D6; --accent-soft:#ECE9FB;
  --good:#1D8A4C; --miss:#C9372F; --miss-soft:#FBE7E5;
  --c-fitness:#EB6834; --c-mind:#2A78D6; --c-diet:#1BAF7A; --c-habit:#EDA100; --c-other:#E87BA4;
  --shadow:0 1px 2px rgba(16,24,38,.05),0 6px 18px rgba(16,24,38,.06);
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F17; --surface:#141B26; --sunk:#1B2431; --ink:#EDF1F7; --ink-2:#C3CAD5; --muted:#8E98A8; --line:#243042;
  --primary:#EDF1F7; --on-primary:#0A0F17;
  --accent:#9085E9; --accent-soft:#25204A;
  --good:#4CC27F; --miss:#F07A70; --miss-soft:#3A1F1E;
  --c-fitness:#D95926; --c-mind:#3987E5; --c-diet:#199E70; --c-habit:#C98500; --c-other:#D55181;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0F17; --surface:#141B26; --sunk:#1B2431; --ink:#EDF1F7; --ink-2:#C3CAD5; --muted:#8E98A8; --line:#243042;
  --primary:#EDF1F7; --on-primary:#0A0F17;
  --accent:#9085E9; --accent-soft:#25204A;
  --good:#4CC27F; --miss:#F07A70; --miss-soft:#3A1F1E;
  --c-fitness:#D95926; --c-mind:#3987E5; --c-diet:#199E70; --c-habit:#C98500; --c-other:#D55181;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-family:var(--display);font-weight:700;letter-spacing:.005em;line-height:1}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.005em}
.sub{margin-top:4px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:2px;white-space:nowrap}
.sub button{height:30px;min-width:30px;display:grid;place-items:center;border-radius:8px;padding:0 6px}
.sub button:disabled{opacity:.3;cursor:default}
.sub .lbl{font-weight:600;color:var(--ink-2)}
.hbtn{height:40px;padding:0 14px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none}

main{padding-block:2px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:16px}
.card h3{margin:0;font-size:16px;font-weight:700}
.card .lead{margin:4px 0 0;color:var(--muted);font-size:14px}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:18px 4px 8px}

/* hero rings */
.hero{display:flex;align-items:center;gap:18px;padding:18px 16px}
.rings{position:relative;flex:none}
.rings .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rings .ctr b{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.rings .ctr span{font-size:12px;color:var(--muted);margin-top:2px}
.rings .arc{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.celebrate .rings svg{animation:pop .7s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.lg{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:14px}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--cat)}
.lg span{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-family:var(--display);font-weight:700;font-size:18px}
.lg b small{font-size:14px;color:var(--muted);font-weight:600}
.status{margin:0 16px 16px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14px;color:var(--ink-2)}
.status.done{background:var(--accent-soft);color:var(--ink)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:12px 8px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border-radius:12px}
.wk small{font-size:12px;color:var(--muted);font-weight:600}
.wk .mr{position:relative}
.wk .mr span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.wk.sel{background:var(--sunk)}
.wk.sel small{color:var(--ink)}
.wk:disabled{opacity:.4;cursor:default}

/* challenge card */
.ch-h{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px}
.ch-h .t{flex:1;min-width:0}
.ch-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;overflow-wrap:anywhere}
.ch-meta{display:flex;align-items:center;gap:12px;margin-top:6px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.ch-meta b{color:var(--ink)}
.flame{display:inline-flex;align-items:center;gap:3px;color:var(--ink-2);font-weight:600}
.flame svg{color:var(--c-fitness)}
.more{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;margin:-4px -6px 0 0}
.track{height:4px;border-radius:2px;background:var(--sunk);margin:0 16px 4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink-2);border-radius:2px}
.tasks{list-style:none;margin:8px 0 0;padding:0}
.task{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:62px;width:100%;text-align:left;border-top:1px solid var(--line)}
.tick{width:34px;height:34px;flex:none;border-radius:50%;border:2.5px solid var(--cat);display:grid;place-items:center;color:transparent;transition:background .15s,transform .15s}
.tick:active{transform:scale(.9)}
.done .tick{background:var(--cat);color:#fff}
.tname{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tname > span{font-weight:600;overflow-wrap:anywhere}
.done .tname > span{color:var(--muted)}
.tname small{font-size:12.5px;color:var(--muted)}
.mini{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:2px;max-width:220px}
.mini i{display:block;height:100%;background:var(--cat);border-radius:3px}
.cnt{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.plus{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:none;font-weight:700}
.rest{padding:14px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
details.note{border-top:1px solid var(--line)}
details.note summary{padding:12px 16px;color:var(--muted);font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.note summary::-webkit-details-marker{display:none}

function ringsSvg(items,size,sw,gap){
 const c=size/2;let r=c-sw/2,out='';
 items.forEach(it=>{
  const C=2*Math.PI*r,p=clamp(it.p||0,0,1);
  out+=`<circle cx="${c}" cy="${c}" r="${r.toFixed(2)}" fill="none" style="stroke:${it.c}" stroke-opacity=".17" stroke-width="${sw}"/>`;
  if(p>0)out+=`<circle class="arc" cx="${c}" cy="${c}" r="${r.toFixed(2)}" fill="none" style="stroke:${it.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-p)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
  r-=sw+gap;
 });
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${out}</svg>`;
}
const one=(p,size,sw,color)=>ringsSvg([{p:p||0,c:color||'var(--accent)'}],size,sw,0);
function colChart(id,bars,o){
 const W=340,H=158,L=30,R=8,T=12,B=22,iw=W-L-R,ih=H-T-B,n=Math.max(1,bars.length);
 const max=o.max||Math.max(1,o.target||0,...bars.map(b=>b.v))*1.08;
 const slot=iw/n,bw=Math.max(2,Math.min(20,slot-2)),y0=T+ih;
 let g='';
 (o.ticks||[]).forEach(tk=>{const y=y0-(tk.v/max)*ih;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax" x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${tk.l}</text>`});
 let bs='';
 bars.forEach((b,i)=>{
  const x=L+i*slot+(slot-bw)/2,h=(clamp(b.v,0,max)/max)*ih;
  if(h>0.5){const r=Math.min(4,bw/2,h),yt=y0-h;
   bs+=`<path class="bar${i===o.sel?' sel':''}" data-i="${i}" style="fill:${b.c||o.color}" d="M${x.toFixed(1)},${y0} V${(yt+r).toFixed(1)} Q${x.toFixed(1)},${yt.toFixed(1)} ${(x+r).toFixed(1)},${yt.toFixed(1)} H${(x+bw-r).toFixed(1)} Q${(x+bw).toFixed(1)},${yt.toFixed(1)} ${(x+bw).toFixed(1)},${(yt+r).toFixed(1)} V${y0} Z"/>`}
  else bs+=`<rect class="bar${i===o.sel?' sel':''}" data-i="${i}" x="${x.toFixed(1)}" y="${y0-1.5}" width="${bw.toFixed(1)}" height="1.5" style="fill:var(--line)"/>`;
 });
 let tl='';
 if(o.target){const y=y0-(o.target/max)*ih;tl=`<line class="tl" x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax" x="${W-R}" y="${(y-5).toFixed(1)}" text-anchor="end">Target ${num(o.target)}</text>`}
 let xl='';const idx=[0];if(n>2)idx.push(Math.floor((n-1)/2));if(n>1)idx.push(n-1);
 idx.forEach(i=>{const x=L+i*slot+slot/2;xl+=`<text class="ax" x="${x.toFixed(1)}" y="${H-6}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}">${esc(bars[i]?bars[i].x:'')}</text>`});
 let hits='';bars.forEach((b,i)=>{hits+=`<rect class="hit" data-act="bar" data-chart="${id}" data-i="${i}" x="${(L+i*slot).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih+B}"/>`});
 chartReads[id]=bars.map(b=>b.read);
 return `<svg class="chart${o.sel!=null?' has-sel':''}" id="ch-${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}<line class="gl" x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}"/>${bs}${tl}${xl}${hits}</svg>`;
}

function heroCard(d){

  ${R.length?R.map((r,i)=>`<div class="rem"><b>${fmt12(r)}</b><button class="btn sm" data-act="remDel" data-i="${i}">Remove</button></div>`).join(''):'<p class="lead" style="margin:0">No reminders set.</p>'}
  ${R.length<4?`<div class="two"><input class="inp" type="time" id="f-rem" value="${R.length?'07:30':'21:00'}" aria-label="Reminder time"><button class="btn primary" data-act="remAdd">Add reminder</button></div>`:''}
  <button class="btn" data-act="remTest">Send a test notification</button>`;
 }else{
  rem=`<p class="lead" style="margin:0">Reminders work in the installed Android app. In this preview you can only browse the screens.</p>`;
 }
 return `<div class="stack">
 <section class="card pad set"><div><h3>Daily reminders</h3><p class="lead">A real Android notification at the times you pick, listing the tasks you still have left. If everything is done, it stays quiet.</p></div>${rem}</section>
 <section class="card pad set"><div><h3>Backup</h3><p class="lead">Your data lives only on this phone. Export a backup file before you reinstall or switch phones.</p></div><div class="row"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button></div><div id="bk"></div></section>
 <section class="card pad set"><div><h3>Erase everything</h3><p class="lead">Removes every challenge and log from this phone.</p></div><button class="btn danger" data-act="askWipe">Erase all data</button></section>
 <p class="hint">Streakline works fully offline. ${S.challenges.length} challenge${S.challenges.length===1?'':'s'} stored on this phone.</p></div>`;
}
const fmt12=hm=>{const p=hm.split(':').map(Number),h=p[0]%12||12;return h+':'+pad(p[1])+(p[0]<12?' am':' pm')};

/* ---------- sheets ---------- */
function openSheet(kind,html){
 ui.sheet=kind;const sh=$('#sheet'),sc=$('#scrim');
 sh.innerHTML='<div class="grab"></div>'+html;sh.hidden=false;sc.hidden=false;
 requestAnimationFrame(()=>{sh.classList.add('show');sc.classList.add('show')});
}
function closeSheet(){
 if(!ui.sheet)return;const was=ui.sheet;ui.sheet=null;ui.draft=null;ui.count=null;const sh=$('#sheet'),sc=$('#scrim');
 sh.classList.remove('show');sc.classList.remove('show');
 setTimeout(()=>{if(!ui.sheet){sh.hidden=true;sc.hidden=true;sh.innerHTML=''}},260);
 if(was==='count')renderView();
}
const sheetHead=t=>`<div class="sheet-h"><h3>${t}</h3><button class="xbtn" data-act="close" aria-label="Close">${I.x}</button></div>`;

function openCount(cid,tid){
 ui.count={cid,tid};
 const c=findC(cid),t=findT(c,tid);
 openSheet('count',sheetHead(esc(t.name))+`<div class="sheet-b" id="csb"></div><div class="sheet-f"><button class="btn primary block" data-act="close">Done</button></div>`);
 renderCount();
}
function renderCount(){
 const b=$('#csb');if(!b||!ui.count)return;
 const c=findC(ui.count.cid),t=findT(c,ui.count.tid),v=+valOf(c.id,ui.date,t.id)||0,tg=+t.target||1,st=stepOf(t),cat=catOf(t.cat);
 const qs=st>=500?[500,1000,2000,5000]:st>=10?[10,25,50,100]:st>=5?[1,5,10,20]:[1,2,5,10];
 b.innerHTML=`<div class="cs"><div class="rings" style="width:190px;height:190px">${one(v/tg,190,18,`var(--c-${cat})`)}<div class="ctr"><b>${num(v)}</b><span>of ${num(tg)} ${esc(t.unit)}</span></div></div>
 <div class="big-pm"><button data-act="cDec" aria-label="Minus ${st}">−</button><input type="number" inputmode="decimal" min="0" id="c-val" data-ch="cset" value="${v}" aria-label="Amount"><button data-act="cInc" aria-label="Plus ${st}">+</button></div>
 <div class="steps">${qs.map(q=>`<button data-act="cAdd" data-q="${q}">+${num(q)}</button>`).join('')}</div>
 <div class="row" style="width:100%"><button class="btn" data-act="cFill">Set to ${num(tg)}</button><button class="btn" data-act="cReset">Reset to 0</button></div></div>
 <p class="hint" style="text-align:center;margin:0">${fmt(ui.date)} · ${esc(c.name)}</p>`;
}

function openEditor(c,tpl){
 if(c)ui.draft=JSON.parse(JSON.stringify(c));
 else{const base=tpl?fromTpl(tpl):{name:'',days:30,strict:false,tasks:[{id:uid(),name:'',cat:'fitness',type:'check',target:1,unit:'',wd:ALLWD.slice()}]};ui.draft=Object.assign({id:null,start:today()},base)}
 openSheet('editor',sheetHead(c?'Edit challenge':'New challenge')+`<div class="sheet-b" id="edb"></div><div class="sheet-f"><button class="btn primary block" data-act="saveDraft">${c?'Save changes':'Start challenge'}</button></div>`);
 renderEditor();
}
function renderEditor(){
 const D=ui.draft,box=$('#edb');if(!box)return;
 const st=box.scrollTop,durs=[10,21,30,60,75,90];
 box.innerHTML=`${D.id?'':`<div class="field"><span class="flabel">Start from a template</span><div class="seg">${TEMPLATES.map((tp,i)=>`<button data-act="applyTpl" data-i="${i}">${esc(tp.name)}</button>`).join('')}</div></div>`}
 <div class="field"><label for="f-name">Name</label><input class="inp" id="f-name" data-in="dname" value="${esc(D.name)}" placeholder="e.g. 30 days of discipline" maxlength="60"></div>
 <div class="field"><span class="flabel">How many days</span><div class="seg">${durs.map(n=>`<button class="${D.days===n?'on':''}" data-act="dur" data-n="${n}">${n}</button>`).join('')}</div></div>
 <div class="two"><div class="field"><label for="f-days">Custom length</label><input class="inp" id="f-days" type="number" inputmode="numeric" min="1" max="1000" data-in="ddays" value="${D.days}"></div>
 <div class="field"><label for="f-start">Starts on</label><input class="inp" id="f-start" type="date" data-in="dstart" value="${D.start}"></div></div>
 <p class="lead" id="f-endnote" style="margin:-6px 0 0">Ends on ${fmt(addDays(D.start,Math.max(1,D.days)-1))}</p>
 <label class="switch" for="f-strict"><span><b>Strict mode</b><small>Flags a missed day and offers to restart from Day 1.</small></span><input type="checkbox" id="f-strict" ${D.strict?'checked':''}></label>
 <div class="flabel" style="margin-top:4px">Daily tasks</div>
 ${D.tasks.map((t,i)=>`<div class="tedit" style="--cat:var(--c-${catOf(t.cat)})">
  <div class="r1"><input class="inp" id="t-name-${t.id}" data-in="tname" data-i="${i}" value="${esc(t.name)}" placeholder="Task, e.g. Run 3 km" maxlength="60" aria-label="Task name"><button class="del" data-act="delTask" data-i="${i}" aria-label="Remove task">${I.trash}</button></div>
  <div class="two"><select class="inp" id="t-cat-${t.id}" data-ch="tcat" data-i="${i}" aria-label="Category">${CAT_ORDER.map(k=>`<option value="${k}" ${catOf(t.cat)===k?'selected':''}>${CATS[k]}</option>`).join('')}</select>
  <div class="seg" role="group" aria-label="How to track"><button class="${t.type!=='count'?'on':''}" data-act="ttype" data-i="${i}" data-v="check" style="flex:1">Tick off</button><button class="${t.type==='count'?'on':''}" data-act="ttype" data-i="${i}" data-v="count" style="flex:1">Count</button></div></div>
  ${t.type==='count'?`<div class="two"><input class="inp" id="t-tg-${t.id}" type="number" inputmode="decimal" min="0" data-in="ttarget" data-i="${i}" value="${t.target}" aria-label="Daily target"><input class="inp" id="t-un-${t.id}" data-in="tunit" data-i="${i}" value="${esc(t.unit)}" placeholder="reps, pages, min" maxlength="14" aria-label="Unit"></div>`:''}
  <div class="wds" role="group" aria-label="Days of the week">${WD.map((w,k)=>`<button class="${(t.wd||ALLWD).includes(k)?'on':''}" data-act="twd" data-i="${i}" data-k="${k}" aria-label="${DAYN[k]}" aria-pressed="${(t.wd||ALLWD).includes(k)}">${w}</button>`).join('')}</div>
 </div>`).join('')}
 <button class="btn block" data-act="addTask">${I.plus} Add a task</button>`;
 box.scrollTop=st;
}
function saveDraft(){
 const D=ui.draft;
 D.name=(D.name||'').trim();D.days=clamp(parseInt(D.days,10)||0,1,1000);
 D.tasks=D.tasks.filter(t=>(t.name||'').trim()).map(t=>Object.assign(t,{name:t.name.trim(),cat:catOf(t.cat),target:t.type==='count'?Math.max(0.1,+t.target||1):1,wd:(t.wd&&t.wd.length?t.wd:ALLWD.slice())}));
 if(!D.name){toast('Give the challenge a name');const f=$('#f-name');if(f)f.focus();return}
 if(!D.tasks.length){toast('Add at least one task with a name');return}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(D.start||''))D.start=today();
 if(D.id){const i=S.challenges.findIndex(x=>x.id===D.id);S.challenges[i]=D;toast('Changes saved')}
 else{D.id=uid();D.created=today();S.challenges.push(D);toast(D.start>today()?'Starts on '+fmtShort(D.start):'Day 1 starts now');ui.tab='today';ui.date=today()}
 ui.pid=D.id;save();closeSheet();render();
}
function confirmSheet(title,body,label,act,cid,danger){
 openSheet('confirm',sheetHead(title)+`<div class="sheet-b"><p style="margin:0">${body}</p></div><div class="sheet-f row"><button class="btn" data-act="close">Cancel</button><button class="btn ${danger?'danger':'primary'}" data-act="${act}" data-cid="${cid||''}">${label}</button></div>`);
}
function chMenu(c){
 openSheet('menu',sheetHead(esc(c.name))+`<div class="sheet-b"><button class="btn block" data-act="openStats" data-cid="${c.id}">See progress</button><button class="btn block" data-act="edit" data-cid="${c.id}">Edit challenge</button><button class="btn block" data-act="askRestart" data-cid="${c.id}">Restart from today</button><button class="btn block danger" data-act="askDelete" data-cid="${c.id}">Delete challenge</button></div>`);
}
function importText(txt){
 let o;try{o=JSON.parse(txt)}catch(e){toast('That file is not a Streakline backup');return}
 if(!o||!Array.isArray(o.challenges)||typeof o.logs!=='object'){toast('That file is not a Streakline backup');return}
 const rem=S.settings.reminders;S=normalize(o);S.settings.reminders=rem;
 save();closeSheet();ui.pid=null;render();toast('Backup restored: '+S.challenges.length+' challenge'+(S.challenges.length===1?'':'s'));
}
window.onBackupPicked=t=>{if(t)importText(t)};
window.onBackupSaved=ok=>toast(ok?'Backup saved':'Backup not saved');
window.onNotifChanged=()=>{if(ui.tab==='settings')renderView()};

/* ---------- actions ---------- */
function setVal(cid,tid,val){
 const c=findC(cid);if(!c)return;
 const d=ui.date,before=ratio(c,d),ab=dayAgg(d),e=getLog(cid,d,true);
 if(val===false||val===0||val==null)delete e.t[tid];else e.t[tid]=val;
 save();
 const after=ratio(c,d),aa=dayAgg(d);
 if(aa.total&&aa.done===aa.total&&ab.done!==ab.total){ui.celebrate=true;haptic(2);toast(d===today()?'Every task done today. Rings closed.':'Day complete')}
 else if(before!==1&&after===1){haptic(2);toast(`Day ${dayNo(c,d)} of ${c.name} complete`)}
 else haptic(0);
 if(ui.sheet==='count')renderCount();else renderView();
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300)}
const findC=id=>S.challenges.find(x=>x.id===id);
const findT=(c,tid)=>c&&c.tasks.find(t=>t.id===tid);
function stepOf(t){const g=+t.target||1;return g>=2000?500:g>=200?10:g>=40?5:1}
const cur=()=>{const c=findC(ui.count.cid),t=findT(c,ui.count.tid);return {c,t,v:+valOf(c.id,ui.date,t.id)||0}};
function syncReminders(){if(has('setReminders'))AND.setReminders(S.settings.reminders.join(','))}

const A={
 tab:el=>{ui.tab=el.dataset.tab;if(ui.tab!=='today')ui.date=today();render();window.scrollTo(0,0)},
 prevDay:()=>{ui.date=addDays(ui.date,-1);render()},
 nextDay:()=>{if(ui.date<today()){ui.date=addDays(ui.date,1);render()}},
 goToday:()=>{ui.date=today();render()},
 close:closeSheet,
 toggle:el=>{const v=valOf(el.dataset.cid,ui.date,el.dataset.tid);setVal(el.dataset.cid,el.dataset.tid,v===true?false:true)},
 fill:el=>{const c=findC(el.dataset.cid),t=findT(c,el.dataset.tid),v=valOf(c.id,ui.date,t.id);setVal(c.id,t.id,isDone(t,v)?0:+t.target||1)},
 inc:el=>{const c=findC(el.dataset.cid),t=findT(c,el.dataset.tid),v=+valOf(c.id,ui.date,t.id)||0;setVal(c.id,t.id,+(v+stepOf(t)).toFixed(2))},
 openCount:el=>openCount(el.dataset.cid,el.dataset.tid),
 cInc:()=>{const x=cur();setVal(x.c.id,x.t.id,+(x.v+stepOf(x.t)).toFixed(2))},
 cDec:()=>{const x=cur();setVal(x.c.id,x.t.id,Math.max(0,+(x.v-stepOf(x.t)).toFixed(2)))},
 cAdd:el=>{const x=cur();setVal(x.c.id,x.t.id,+(x.v+(+el.dataset.q)).toFixed(2))},
 cFill:()=>{const x=cur();setVal(x.c.id,x.t.id,+x.t.target||1)},
 cReset:()=>{const x=cur();setVal(x.c.id,x.t.id,0)},
 chMenu:el=>chMenu(findC(el.dataset.cid)),
 newChallenge:()=>openEditor(null),
 newFromTpl:el=>openEditor(null,TEMPLATES[+el.dataset.i]),
 applyTpl:el=>{Object.assign(ui.draft,fromTpl(TEMPLATES[+el.dataset.i]));renderEditor()},
 dur:el=>{ui.draft.days=+el.dataset.n;renderEditor()},
 addTask:()=>{ui.draft.tasks.push({id:uid(),name:'',cat:'habit',type:'check',target:1,unit:'',wd:ALLWD.slice()});renderEditor();const b=$('#edb');b.scrollTop=b.scrollHeight;const ins=b.querySelectorAll('[data-in="tname"]');ins[ins.length-1].focus()},
 delTask:el=>{ui.draft.tasks.splice(+el.dataset.i,1);renderEditor()},
 ttype:el=>{const t=ui.draft.tasks[+el.dataset.i];t.type=el.dataset.v;if(t.type==='count'&&(!t.target||t.target<=1))t.target=10;renderEditor()},
 twd:el=>{const t=ui.draft.tasks[+el.dataset.i],k=+el.dataset.k;t.wd=t.wd||ALLWD.slice();const j=t.wd.indexOf(k);if(j>=0){if(t.wd.length>1)t.wd.splice(j,1);else toast('Keep at least one day')}else{t.wd.push(k);t.wd.sort()}renderEditor()},
 saveDraft,
 openStats:el=>{closeSheet();ui.pid=el.dataset.cid;ui.tab='stats';render();window.scrollTo(0,0)},
 pick:el=>{ui.pid=el.dataset.cid;ui.ctask=null;renderView()},
 pickTask:el=>{ui.ctask=el.dataset.tid;renderView()},
 bar:el=>{const id=el.dataset.chart,i=+el.dataset.i,svg=$('#ch-'+id);if(!svg)return;svg.classList.add('has-sel');svg.querySelectorAll('.bar').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));const ro=$('#ro-'+id);if(ro)ro.innerHTML=chartReads[id][i]||''},
 jump:el=>{ui.date=el.dataset.d;ui.tab='today';render();window.scrollTo(0,0)},
 edit:el=>{closeSheet();setTimeout(()=>openEditor(findC(el.dataset.cid)),ui.sheet?0:10)},
 askRestart:el=>{const c=findC(el.dataset.cid);confirmSheet('Restart '+esc(c.name)+'?','Day 1 becomes today and the days logged so far are cleared. Your tasks stay the same.','Restart from today','doRestart',c.id)},
 doRestart:el=>{const c=findC(el.dataset.cid);c.start=today();c.attempt=(c.attempt||1)+1;delete S.logs[c.id];save();closeSheet();ui.date=today();render();toast('Restarted. Day 1 is today')},
 askDelete:el=>{const c=findC(el.dataset.cid);confirmSheet('Delete '+esc(c.name)+'?','The challenge and every day logged in it are removed from this phone. This cannot be undone.','Delete','doDelete',c.id,true)},
 doDelete:el=>{S.challenges=S.challenges.filter(x=>x.id!==el.dataset.cid);delete S.logs[el.dataset.cid];ui.pid=null;save();closeSheet();render();toast('Challenge deleted')},
 askWipe:()=>confirmSheet('Erase all data?','Every challenge and log on this phone is removed. Export a backup first if you might want it back.','Erase everything','doWipe','',true),
 doWipe:()=>{const r=S.settings.reminders;S=fresh();S.settings.reminders=r;save();closeSheet();ui.pid=null;ui.date=today();render();toast('All data erased')},
 remAdd:()=>{const v=($('#f-rem')||{}).value;if(!v)return;if(S.settings.reminders.includes(v)){toast('That time is already set');return}S.settings.reminders.push(v);S.settings.reminders.sort();save();syncReminders();renderView();toast('Reminder set for '+fmt12(v))},
 remDel:el=>{S.settings.reminders.splice(+el.dataset.i,1);save();syncReminders();renderView();toast('Reminder removed')},
 remTest:()=>{if(has('testNotification'))AND.testNotification();toast('Test notification sent')},
 notifSettings:()=>{if(has('openNotificationSettings'))AND.openNotificationSettings()},
 export:()=>{
  const json=JSON.stringify(S);
  if(has('exportBackup')){AND.exportBackup(json,'streakline-backup-'+today()+'.json');return}
  $('#bk').innerHTML=`<textarea class="code" id="bk-out" readonly>${esc(json)}</textarea><button class="btn sm" data-act="copyBk">Copy</button>`;
 },
 copyBk:()=>{const ta=$('#bk-out');const fb=()=>{ta.select();toast('Selected. Copy it manually')};try{navigator.clipboard.writeText(ta.value).then(()=>toast('Backup copied'),fb)}catch(e){fb()}},
 import:()=>{
  if(has('pickBackup')){AND.pickBackup();return}
  $('#bk').innerHTML=`<input type="file" accept=".json,application/json,text/plain" id="bk-file" class="inp" style="padding-top:11px"><textarea class="code" id="bk-in" placeholder="Or paste backup text here"></textarea><button class="btn sm" data-act="importPaste">Restore pasted text</button>`;
 },
 importPaste:()=>{const v=$('#bk-in').value.trim();if(v)importText(v);else toast('Paste the backup text first')},
 sample:()=>{
  const a=fromTpl(TEMPLATES[0]);a.id=uid();a.name='Fit in 30 (sample)';a.start=addDays(today(),-12);
  const b=fromTpl(TEMPLATES[1]);b.id=uid();b.name='Learn daily (sample)';b.start=addDays(today(),-6);
  S.challenges.push(a,b);
  const fillC=(c,n,miss,part,seed)=>{for(let i=0;i<n;i++){const d=addDays(c.start,i),e=getLog(c.id,d,true);sched(c,d).forEach((t,k)=>{const r=((i*7+k*13+seed)%10)/10;if(miss.includes(i)&&k%2===0)return;const short=part.includes(i)&&k===sched(c,d).length-1;e.t[t.id]=t.type==='count'?Math.round(+t.target*(short?.6:r<.7?1:1.25)):!short})}};
  fillC(a,12,[4],[7,10],3);fillC(b,6,[],[2],5);
  const e=getLog(a.id,today(),true);e.t[a.tasks[1].id]=30;e.t[a.tasks[3].id]=5;e.t[a.tasks[0].id]=true;
  save();ui.date=today();render();window.scrollTo(0,0);toast('Sample data loaded. Delete it any time');
 }
};

document.addEventListener('click',e=>{
 if(e.target.id==='scrim'){closeSheet();return}
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
let noteT;
document.addEventListener('input',e=>{
 const el=e.target,k=el.dataset.in;if(!k)return;const D=ui.draft;
 if(k==='note'){const en=getLog(el.dataset.cid,ui.date,true);en.note=el.value;clearTimeout(noteT);noteT=setTimeout(save,400);return}
 if(!D)return;
 const endn=()=>{const en=$('#f-endnote');if(en&&D.days>0)en.textContent='Ends on '+fmt(addDays(D.start,D.days-1))};
 if(k==='dname')D.name=el.value;
 else if(k==='ddays'){D.days=parseInt(el.value,10)||0;endn();document.querySelectorAll('[data-act="dur"]').forEach(b=>b.classList.toggle('on',+b.dataset.n===D.days))}
 else if(k==='dstart'){if(el.value){D.start=el.value;endn()}}
 else if(k==='tname')D.tasks[+el.dataset.i].name=el.value;
 else if(k==='ttarget')D.tasks[+el.dataset.i].target=el.value;
 else if(k==='tunit')D.tasks[+el.dataset.i].unit=el.value;
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='f-strict'&&ui.draft){ui.draft.strict=el.checked;return}
 if(el.id==='bk-file'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(el.files[0]);return}
 const k=el.dataset.ch;if(!k)return;
 if(k==='cset'){const x=cur();setVal(x.c.id,x.t.id,Math.max(0,parseFloat(el.value)||0))}
 if(k==='tcat'&&ui.draft){ui.draft.tasks[+el.dataset.i].cat=el.value;renderEditor()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.note'))ui.openNotes[d.dataset.cid]=d.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

window.onAndroidBack=function(){
 if(ui.sheet){closeSheet();return true}
 if(ui.tab!=='today'||ui.date!==today()){ui.tab='today';ui.date=today();render();return true}
 return false;
};
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(today()!==lastDay){if(ui.date===lastDay)ui.date=today();lastDay=today()}render()});

if(isAndroid&&S.settings.migrated){delete S.settings.migrated;save();syncReminders()}
render();
})();
</script>
</body></html>
